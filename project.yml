name: Yuvomi
options:
  bundleIdPrefix: fr.sugow
  deploymentTarget:
    iOS: "26.0"
    macOS: "26.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "6.0"
    SWIFT_STRICT_CONCURRENCY: complete
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    DEVELOPMENT_TEAM: "LARK4DRRVG"

packages:
  YuvomiKit:
    path: Packages/YuvomiKit

schemes:
  Yuvomi:
    build:
      targets:
        Yuvomi: all
        YuvomiWidgets: all
    run:
      config: Debug

targets:
  Yuvomi:
    type: application
    supportedDestinations: [iOS, macOS]
    sources:
      - path: App
    dependencies:
      - package: YuvomiKit
      - target: YuvomiWidgets
    entitlements:
      path: App/Yuvomi.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.fr.sugow.yuvomi]
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Yuvomi
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        NSLocalNetworkUsageDescription: Yuvomi se connecte à votre serveur sur le réseau local.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIBackgroundModes: [fetch]
        BGTaskSchedulerPermittedIdentifiers: [fr.sugow.yuvomi.reminders]
        CFBundleURLTypes:
          - CFBundleURLName: fr.sugow.yuvomi.pair
            CFBundleURLSchemes: [yuvomi]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sugow.yuvomi
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic

  YuvomiWidgets:
    type: app-extension
    supportedDestinations: [iOS, macOS]
    sources:
      - path: Widgets
    dependencies:
      - package: YuvomiKit
      - sdk: WidgetKit.framework
      - sdk: SwiftUI.framework
    entitlements:
      path: Widgets/YuvomiWidgets.entitlements
      properties:
        com.apple.security.app-sandbox: true
        com.apple.security.network.client: true
        com.apple.security.application-groups: [group.fr.sugow.yuvomi]
    info:
      path: Widgets/Info.plist
      properties:
        CFBundleDisplayName: Yuvomi
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: fr.sugow.yuvomi.widgets
        TARGETED_DEVICE_FAMILY: "1,2"
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_STYLE: Automatic
